default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/poker_mix_game_development.sqlite3

test:
  <<: *default
  database: storage/poker_mix_game_test.sqlite3

production:
  primary: &primary_production
    <<: *default
    database: storage/poker_mix_game_production.sqlite3
  cache:
    <<: *primary_production
    database: storage/poker_mix_game_production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: storage/poker_mix_game_production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: storage/poker_mix_game_production_cable.sqlite3
    migrations_paths: db/cable_migrate
